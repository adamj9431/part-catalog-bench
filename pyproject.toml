[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "part-catalog-bench"
version = "0.1.0"
description = "A source-agnostic benchmark for AI comprehension of illustrated parts catalogs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Part Catalog Bench contributors" }]
dependencies = [
  "cryptography>=42,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
part-catalog-bench = "part_catalog_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/part_catalog_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
